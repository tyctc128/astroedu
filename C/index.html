<!doctype html>
<html lang="zh-Hant" data-theme="C">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12102b"><meta name="description" content="AstroEdu 互動星空探索學院：真實星表、天文模擬、課堂任務與觀測筆記。"><title>AstroEdu · 探索任務工作室</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#workspace">前往星圖與課程</a>
<div id="app"><header class="topbar"><a class="brand" href="./" aria-label="AstroEdu 首頁"><span class="brand-mark" aria-hidden="true">✦</span><span><b>AstroEdu</b><small>星空探索學院</small></span></a><nav class="topnav" aria-label="主選單"><button data-action="explore" class="nav-active"><span data-icon="compass"></span>探索</button><button data-action="courses"><span data-icon="book"></span><span class="course-nav">課程</span></button><button data-action="notes"><span data-icon="note"></span><span class="notes-nav">筆記</span></button></nav><div class="header-actions"><button class="search-trigger" data-action="search"><span data-icon="search"></span><span>搜尋星體、星座…</span><kbd>/</kbd></button><button class="icon-button" data-action="night" title="夜間紅光模式" aria-label="夜間紅光模式"><span data-icon="moon"></span></button><button class="icon-button" data-action="help" title="使用說明" aria-label="使用說明"><span data-icon="help"></span></button></div></header>
<main id="workspace" class="workspace" tabindex="-1">
<aside class="rail" aria-label="探索工具"><div class="rail-heading">觀測工作台</div><button data-action="explore" class="rail-selected"><span data-icon="compass"></span><span>星空探索</span></button><button data-action="courses"><span data-icon="book"></span><span>互動課程</span></button><button data-action="search"><span data-icon="search"></span><span>天體圖鑑</span></button><button data-action="layers"><span data-icon="layers"></span><span>星圖圖層</span></button><button data-action="notes"><span data-icon="note"></span><span>我的筆記</span></button><div class="rail-bottom"><span class="overline">LOOK UP, WONDER MORE</span><p>從一顆星，<br>開始探索宇宙。</p><button data-action="help"><span data-icon="help"></span><span>操作指南</span></button><span class="version-label">C / 探索任務工作室</span></div></aside>
<section class="sky-card" aria-label="互動星圖"><canvas id="sky" tabindex="0" aria-label="星圖：方向鍵移動，加減鍵縮放；亦可由搜尋清單選取天體"></canvas><div class="sky-title"><span class="eyebrow">今晚，一起仰望</span><h1>夏季大三角</h1><div class="scene-meta"><span id="scene-date"></span><button data-action="location"><span data-icon="pin"></span><span id="scene-place">台北</span></button></div><span id="play-status" class="status-pill">模擬已暫停</span><div class="sky-quick-actions" role="group" aria-label="定位與 AR 觀星"><button class="quick-locate" data-action="locate-now" aria-label="開始觀星：取得位置與手機方向"><span data-icon="pin"></span>開始觀星</button><button class="quick-ar" data-action="ar" aria-label="AR 觀星：切換相機背景"><span data-icon="camera"></span>AR 觀星</button></div></div><div class="sky-tools"><button class="icon-button" data-action="advanced" aria-label="進階星圖、實驗室與 AR" title="進階星圖、實驗室與 AR">✧</button><button class="icon-button" data-action="search" aria-label="搜尋天體" title="搜尋天體"><span data-icon="search"></span></button><button class="icon-button" data-action="layers" aria-label="圖層設定" title="圖層設定"><span data-icon="layers"></span></button><button class="icon-button" data-action="zoom-in" aria-label="放大星圖" title="放大"><span data-icon="plus"></span></button><button class="icon-button" data-action="zoom-out" aria-label="縮小星圖" title="縮小"><span data-icon="minus"></span></button><button class="icon-button" data-action="fullscreen" aria-label="全螢幕" title="全螢幕"><span data-icon="expand"></span></button></div><div class="sky-bottom"><button class="compass-button" data-action="north" aria-label="對準北方"><span>N</span><span data-icon="compass"></span></button><div class="view-readout"><span id="view-direction"></span><span id="view-fov"></span></div><button class="recenter" data-action="recenter"><span data-icon="target"></span>回到目標</button></div><div id="sky-loading">正在載入星空…</div></section>
<aside class="study-panel" aria-label="課程與天體資訊"><section class="lesson-card"><div class="lesson-top"><span class="lesson-tag">星空觀測入門</span><button data-action="courses" class="text-button">切換課程 <span data-icon="chevron"></span></button></div><div class="lesson-heading"><div><span class="overline" id="lesson-kicker">GUIDED EXPLORATION</span><h2 id="lesson-title">夏季大三角</h2></div><div class="progress-numeral"><strong id="progress-number">0</strong><span>/ 4</span></div></div><div class="progress-bars" aria-label="課程進度"><i></i><i></i><i></i><i></i></div><p id="lesson-intro" class="lesson-intro"></p><div id="mission-list"></div><div id="lesson-extra"></div><div class="lesson-actions"><button data-action="hint" class="text-button"><span data-icon="bulb"></span>給我提示</button><button data-action="reset-lesson" class="text-button"><span data-icon="reset"></span>重設</button></div><p id="hint-text" class="hint-text" hidden></p></section><section class="target-card"><div class="target-heading"><span class="overline">目前選取天體</span><span id="object-id"></span></div><div class="target-body"><div class="star-thumbnail" id="target-visual">✦</div><div><h3 id="target-name">織女星 <small>Vega</small></h3><p id="target-subtitle"></p></div></div><div id="target-metrics" class="metrics"></div><p id="target-description"></p><div class="target-actions"><button data-action="save-note" class="primary"><span data-icon="note"></span>加入觀測筆記</button><button data-action="track" class="icon-button" aria-label="追蹤選取天體" title="追蹤天體"><span data-icon="target"></span></button></div></section></aside>
<section class="timeline" aria-label="時間控制"><div class="time-title"><span data-icon="clock"></span><b>時間控制</b><button data-action="now" class="text-button">現在</button></div><div class="time-main"><button data-action="datetime" class="date-button"><span data-icon="calendar"></span><span id="date-display"></span><span data-icon="chevron"></span></button><div class="playback"><button class="icon-button" data-action="previous" title="前一小時" aria-label="前一小時"><span data-icon="previous"></span></button><button data-action="play" id="play-button" class="play-button" aria-label="播放時間"><span data-icon="play"></span></button><button class="icon-button" data-action="next" title="後一小時" aria-label="後一小時"><span data-icon="next"></span></button></div><label class="time-slider"><span>00:00</span><input id="time-range" type="range" min="0" max="1439" step="1" aria-label="當日時間"><span>23:59</span></label><label class="speed-label"><span>時間流速</span><select id="speed" aria-label="時間流速"><option value="1">1×</option><option value="60" selected>60×</option><option value="600">600×</option><option value="3600">3600×</option><option value="-600">−600×</option></select></label></div><div class="time-footer"><span>UTC+08:00 · 台灣時間</span><button data-action="share" class="text-button"><span data-icon="share"></span>分享情境</button><button data-action="capture" class="text-button"><span data-icon="camera"></span>星圖截圖</button></div></section>
<section class="discovery-card"><div><span data-icon="note"></span><b>觀測紀錄</b><span id="found-count">已找到 0 / 3</span></div><div id="discovery-list"></div></section>
</main><footer class="app-footer"><span>真實星表 · 用好奇心探索夜空</span><span>C · 探索任務工作室</span><button data-action="about">資料來源與版本</button></footer></div>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button data-action="close" class="icon-button" aria-label="關閉視窗"><span data-icon="close"></span></button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<noscript>請啟用 JavaScript 以操作星圖。</noscript><script src="vendor/astronomy.js"></script><script src="data.js"></script><script src="core.js"></script><script src="advanced.js"></script><script src="app.js"></script></body></html>
